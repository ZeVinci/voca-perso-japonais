<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voca Jap</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ACCUEIL ===== -->
  <div id="home-screen" class="screen active">
    <header>
      <h1>日本語</h1>
      <p class="subtitle">Réviser le vocabulaire</p>
    </header>
    <div class="home-buttons">
      <button class="big-button" data-action="goto-learn">📖 Apprendre</button>
      <button class="big-button" data-action="goto-revise-setup">🎯 Réviser</button>
    </div>
    <p class="word-count" id="word-count"></p>
  </div>

  <!-- ===== APPRENDRE ===== -->
  <div id="learn-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" data-action="goto-home">← Accueil</button>
      <h2>Apprendre</h2>
      <button class="icon-btn" id="learn-filter-toggle" aria-label="Filtres">⚙</button>
    </div>

    <!-- Panneau filtres (caché par défaut) -->
    <div class="filter-panel" id="learn-filter-panel" style="display:none">
      <div class="filter-group">
        <div class="filter-group-label">Cours</div>
        <div class="chip-row" id="learn-chips-cours"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Topic</div>
        <div class="chip-row" id="learn-chips-topic"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Cacher</div>
        <div class="chip-row">
          <label class="cb-label"><input type="checkbox" id="hide-jp"> Japonais</label>
          <label class="cb-label"><input type="checkbox" id="hide-fr"> Français</label>
        </div>
      </div>
      <div class="filter-count" id="learn-count"></div>
    </div>

    <div class="learn-list" id="learn-list"></div>
  </div>

  <!-- ===== RÉVISION SETUP ===== -->
  <div id="revise-setup-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" data-action="goto-home">← Accueil</button>
      <h2>Réviser</h2>
      <div style="width:40px"></div>
    </div>

    <div class="setup-body">
      <div class="setup-section">
        <div class="setup-section-title">Filtrer</div>
        <div class="filter-group">
          <div class="filter-group-label">Cours</div>
          <div class="chip-row" id="rev-chips-cours"></div>
        </div>
        <div class="filter-group">
          <div class="filter-group-label">Topic</div>
          <div class="chip-row" id="rev-chips-topic"></div>
        </div>
        <div class="setup-count" id="rev-count"></div>
      </div>

      <div class="setup-section">
        <div class="setup-section-title">Sens</div>
        <label class="radio-label">
          <input type="radio" name="rev-dir" value="jp-fr" checked> Japonais → Français
        </label>
        <label class="radio-label">
          <input type="radio" name="rev-dir" value="fr-jp"> Français → Japonais
        </label>
      </div>

      <button class="big-button" data-action="start-revise">Commencer</button>
    </div>
  </div>

  <!-- ===== RÉVISION JEU ===== -->
  <div id="revise-game-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" data-action="stop-revise">← Arrêter</button>
      <div class="score">
        <span class="score-good" id="score-good">0</span>
        <span class="score-mid" id="score-mid"> · </span>
        <span class="score-mid-val" id="score-mid-val">0</span>
        <span class="score-sep"> / </span>
        <span id="score-total">0</span>
      </div>
    </div>

    <div class="card" id="card">
      <div class="card-prompt" id="card-prompt"></div>
      <div class="card-hint" id="card-hint">Touche pour révéler</div>
      <div class="card-answer" id="card-answer" style="display:none"></div>
    </div>

    <div class="answer-buttons" id="answer-buttons" style="display:none">
      <button class="answer-btn wrong"   data-action="mark-wrong">❌ Raté</button>
      <button class="answer-btn middle"  data-action="mark-middle">〜 Moyen</button>
      <button class="answer-btn right"   data-action="mark-right">✅ Réussi</button>
    </div>
  </div>

  <script src="vocab.js"></script>
  <script src="app.js"></script>
</body>
</html>
